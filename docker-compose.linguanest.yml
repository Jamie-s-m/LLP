version: '3.8'
services:
  api:
    build: ./backend
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/srv/backend
  web:
    build: ./frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./frontend:/srv/frontend
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: lingua
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: linguanest
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  db-data: {}
