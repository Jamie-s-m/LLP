<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Moved out of a CSS @import (was in index.css) - an @import isn't discoverable by the
         browser's preload scanner until the main stylesheet itself has been fetched and parsed,
         serializing the font fetch behind it. Real <link> tags here let the browser start this
         connection and the stylesheet fetch in parallel with everything else, right away. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" /></noscript>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%linguanest-mark.svg" />
    <link rel="shortcut icon" href="%BASE_URL%linguanest-mark.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%BASE_URL%icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="%BASE_URL%icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="%BASE_URL%icons/icon-128x128.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C84B31" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LinguaNest" />
    <meta name="application-name" content="LinguaNest" />
    <meta name="msapplication-TileColor" content="#C84B31" />
    <meta name="msapplication-tap-highlight" content="no" />
    <!--
      description/og:*/twitter:*/canonical and <title> are deliberately NOT static here - every
      route renders its own via <Seo> (src/components/Seo.tsx, react-helmet-async), including a
      site-wide default in App.tsx for routes that don't set anything more specific. A static
      copy here would sit outside Helmet's managed tree and never get removed on mount, which
      was confirmed live to produce two conflicting <meta name="description">/og:title/canonical
      tags in the same document - this comment is the record of why, so it doesn't get "fixed"
      back by someone assuming the static copy was an oversight.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinguaNest" />
    <meta name="twitter:card" content="summary" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
