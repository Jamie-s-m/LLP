<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">LinguaNest orbit illustration</title>
  <desc id="desc">A premium orbit-style illustration representing language learning with a 3D card and floating elements.</desc>
  <defs>
    <linearGradient id="ringGradient" x1="26" y1="20" x2="208" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B5CE2"/>
      <stop offset="0.35" stop-color="#36C9A5"/>
      <stop offset="0.7" stop-color="#FFB547"/>
      <stop offset="1" stop-color="#FF6B5E"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="52" y1="34" x2="176" y2="176" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBF9FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1E2A7A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="86" fill="none" stroke="url(#ringGradient)" stroke-width="6" stroke-dasharray="9 12" opacity="0.9"/>
  <circle cx="120" cy="120" r="54" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <g filter="url(#cardShadow)">
    <rect x="65" y="70" width="110" height="88" rx="24" fill="url(#cardGradient)"/>
    <rect x="82" y="88" width="76" height="18" rx="9" fill="#5B5CE2" opacity="0.14"/>
    <rect x="82" y="116" width="52" height="12" rx="6" fill="#36C9A5" opacity="0.18"/>
    <rect x="82" y="132" width="62" height="12" rx="6" fill="#FFB547" opacity="0.18"/>
    <circle cx="161" cy="99" r="16" fill="url(#ringGradient)"/>
    <path d="M155 99L160 104L170 93" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <circle cx="180" cy="64" r="10" fill="#FFB547"/>
  <circle cx="64" cy="170" r="8" fill="#36C9A5"/>
  <circle cx="192" cy="146" r="7" fill="#FF6B5E"/>
  <path d="M42 124C58 108 81 101 100 103" stroke="#5BA7FF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M156 169C168 154 182 146 200 146" stroke="#36C9A5" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
</svg>
