<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">LinguaNest orbit illustration</title>
  <desc id="desc">A premium language-learning illustration with a modern orbit and elegant study cards.</desc>
  <defs>
    <linearGradient id="ringGradient" x1="36" y1="18" x2="216" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B5CE2"/>
      <stop offset="0.34" stop-color="#4F9CF9"/>
      <stop offset="0.62" stop-color="#1CC9A5"/>
      <stop offset="1" stop-color="#FFBF59"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="54" y1="38" x2="188" y2="168" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14264C" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="120" cy="120" r="88" fill="none" stroke="url(#ringGradient)" stroke-width="6" stroke-dasharray="10 12" opacity="0.92"/>
  <circle cx="120" cy="120" r="55" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>

  <g filter="url(#cardShadow)">
    <rect x="58" y="68" width="122" height="96" rx="28" fill="url(#cardGradient)"/>
    <rect x="78" y="92" width="82" height="18" rx="9" fill="#5B5CE2" opacity="0.12"/>
    <rect x="78" y="119" width="56" height="12" rx="6" fill="#1CC9A5" opacity="0.18"/>
    <rect x="78" y="138" width="68" height="12" rx="6" fill="#FFBF59" opacity="0.22"/>
    <circle cx="157" cy="101" r="16" fill="url(#ringGradient)"/>
    <path d="M151 101L156 106L166 96" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <circle cx="180" cy="60" r="11" fill="#FFBF59"/>
    <circle cx="60" cy="172" r="9" fill="#1CC9A5"/>
    <circle cx="196" cy="148" r="8" fill="#FF7A6A"/>
    <path d="M40 128C57 111 75 103 98 104" stroke="#66A7FF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <path d="M153 170C167 154 182 147 200 147" stroke="#42D1B4" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  </g>

  <path d="M118 42C136 61 145 79 145 101" stroke="rgba(255,255,255,0.6)" stroke-width="4" stroke-linecap="round"/>
</svg>
