<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title" color="#000000">
  <title id="title">LinguaNest symbol — Twin Arc (monochrome)</title>
  <!-- Single-color version: one solid form, one outlined form, overlapping. Set this
       SVG's `color` (via the color attribute above, or CSS `color` where embedded) to
       control the ink — defaults to black. Works identically inverted (white ink on a
       dark/colored ground). -->
  <circle cx="42" cy="50" r="27" fill="currentColor"/>
  <circle cx="64" cy="50" r="27" fill="none" stroke="currentColor" stroke-width="6"/>
</svg>
