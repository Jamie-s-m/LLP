<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">LinguaNest app icon — Twin Arc, maskable safe-zone</title>
  <!-- Source for the rasterized PWA/apple-touch icons in public/icons/. The plain symbol.svg
       has no background and its mark runs close to the edges, which is fine for a favicon
       but not for a maskable icon (OS icon shapes crop a circle/squircle out of the square
       canvas, so content needs to stay inside a safe center zone). This scales the mark
       down ~28% around center and gives it a solid paper background so it survives cropping
       and doesn't render as a transparent void on platforms that don't support "any". -->
  <rect width="100" height="100" fill="#F5F1EA"/>
  <g style="isolation:isolate" transform="translate(50,50) scale(0.72) translate(-50,-50)">
    <circle cx="42" cy="50" r="27" fill="#7C2D42"/>
    <circle cx="64" cy="50" r="27" fill="#C84B31" style="mix-blend-mode:multiply"/>
  </g>
</svg>
