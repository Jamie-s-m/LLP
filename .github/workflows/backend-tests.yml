name: Backend CI - Tests

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    # See ci-cd.yml's build-and-test job for why: a real service container is far more
    # reliable here than each test file spinning up its own MongoMemoryServer instance.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          # Without this, actions/setup-node looks for a lock file at the repo root - it
          # doesn't exist here (package-lock.json lives in backend/), so the cache step
          # failed outright before a single dependency installed.
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          NODE_ENV: test
          # Not a real secret - only used by the Payme webhook test suite to exercise the
          # Basic-auth check locally within CI, matching backend/.env's local dev value.
          PAYME_MERCHANT_KEY: ci_test_key_12345
          MONGODB_TEST_URI: mongodb://localhost:27017
        run: npm test
