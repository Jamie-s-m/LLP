name: Secret Scan (gitleaks)

on:
  pull_request:
    branches: [ main, master, feat/mobile-bottom-nav-darkmode ]
  push:
    branches: [ main, master, feat/mobile-bottom-nav-darkmode ]

jobs:
  gitleaks:
    name: Run gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The previous step here ran `npx -y gitleaks ...`, but the npm package named
      # "gitleaks" is an unrelated third-party stub (published by a different, unrelated
      # maintainer) - it silently failed every run ("could not determine executable to
      # run"), and `|| true` hid that failure, so this job never actually scanned anything.
      # Download the real, official Go binary directly instead of trusting a third-party
      # Action's undocumented input surface.
      - name: Install gitleaks
        run: |
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      # A real scan of this repo's full history (run locally before this change shipped)
      # found exactly 3 findings, all reviewed and confirmed non-sensitive: two test-only
      # dummy Payme keys committed inside CI workflow env vars, and one bundle-visualizer
      # build artifact (frontend/dist, since removed and gitignored) whose chunk-hash
      # string tripped a generic-entropy rule. Those 3 are recorded in
      # .gitleaks-baseline.json so this job blocks on any NEW leak going forward without
      # permanently failing over already-reviewed history - rewriting git history to
      # scrub old commits is a separate, deliberate decision, not done here.
      - name: Run gitleaks
        run: |
          ./gitleaks detect \
            --source . \
            --baseline-path=.gitleaks-baseline.json \
            --report-path=gitleaks-report.json \
            --redact \
            --verbose

      - name: Upload gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
