name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test -- run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npx eslint src

      - name: Test backend
        working-directory: backend
        env:
          NODE_ENV: test
          # Not a real secret - only used by the Payme webhook test suite to exercise the
          # Basic-auth check locally within CI, matching backend/.env's local dev value.
          PAYME_MERCHANT_KEY: ci_test_key_12345
          # mongodb-memory-server's default MongoDB version download is built against
          # OpenSSL 1.1 (libcrypto.so.1.1), which the ubuntu-latest runner no longer ships
          # (removed from Ubuntu's repos after 20.04) - every test run was failing on
          # "library is missing" before ever reaching a single assertion. Pin a MongoDB
          # version whose official Linux build targets OpenSSL 3 instead of chasing down a
          # legacy system package. MongoDB 7.0 also dropped the ephemeralForTest storage
          # engine mongodb-memory-server defaults to, so wiredTiger (always available) has
          # to be selected explicitly too.
          MONGOMS_VERSION: 7.0.14
          MONGOMS_STORAGE_ENGINE: wiredTiger
        run: npm test

  deploy-render:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
