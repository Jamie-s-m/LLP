name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A real, long-lived MongoDB service container - far more reliable in CI than each of the
    # 16 backend test files spinning up its own MongoMemoryServer instance, which was flaky
    # under this runner's resource constraints (slow/failed startups, unexpected exits) even
    # after pinning a compatible MongoDB version. tests/jest.setup.js connects to this via
    # MONGODB_TEST_URI below.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm test -- run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint backend
        working-directory: backend
        run: npx eslint src

      - name: Test backend
        working-directory: backend
        env:
          NODE_ENV: test
          # Not a real secret - only used by the Payme webhook test suite to exercise the
          # Basic-auth check locally within CI, matching backend/.env's local dev value.
          PAYME_MERCHANT_KEY: ci_test_key_12345
          # Points tests/jest.setup.js at the mongodb service container above instead of
          # spinning up MongoMemoryServer - see the services: block for why.
          MONGODB_TEST_URI: mongodb://localhost:27017
        run: npm test

  # No deploy job here on purpose. Both Render services (linguanest-api, linguanest-web) have
  # native GitHub auto-deploy enabled (autoDeploy: "yes", autoDeployTrigger: "commit", confirmed
  # via the Render API) - Render watches this repo's `main` branch directly and deploys the
  # latest commit on every push, independent of anything in this workflow. A previous version of
  # this file also POSTed to a Render "deploy hook" URL as a second, redundant trigger; that
  # secret (RENDER_DEPLOY_HOOK_URL) was never actually configured, so that job failed on every
  # push while the real deployment succeeded anyway via the native path. Removed rather than
  # fixed: maintaining two independent deploy mechanisms for the same commit is unnecessary
  # complexity and a latent race (both would fire on every push if the secret were ever set).
  # This job's only responsibility is now what its name says - validate, not deploy.
