<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinguaNest — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0C0B;--surface:#151311;--card:#1C1A17;--text:#F3EEEA;--text-secondary:#A8A09A;--muted:#6B6560;--accent:#E07A50;--accent-light:#F2A88A;--accent-bg:rgba(224,122,80,0.12);--border:rgba(243,238,234,0.08);--border-strong:rgba(243,238,234,0.14);--font-display:"Bricolage Grotesque",sans-serif;--font-body:"IBM Plex Sans",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.6;display:flex;min-height:800px}
.left{flex:1;background:var(--surface);border-right:1px solid var(--border);padding:64px;display:flex;flex-direction:column;justify-content:space-between}
.left-top{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
.left-top svg{width:40px;height:40px}
.left-top span{font-family:var(--font-display);font-weight:700;font-size:20px}
.quote{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.3;letter-spacing:-0.01em;max-width:380px}
.quote span{color:var(--accent-light)}
.stat{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.stat strong{color:var(--text);font-size:24px;font-family:var(--font-display)}
.right{width:480px;padding:80px 48px;display:flex;flex-direction:column;justify-content:center}
.right h1{font-family:var(--font-display);font-size:34px;font-weight:800;margin-bottom:8px;letter-spacing:-0.02em}
.right>p{color:var(--text-secondary);font-size:15px;margin-bottom:32px}
.form-group{margin-bottom:20px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em}
.form-group input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 14px;border-radius:10px;font-size:15px;font-family:var(--font-body);outline:none}
.form-options{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;font-size:13px}
.form-options a{color:var(--accent);text-decoration:none;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:12px;font-family:var(--font-display);font-size:16px;font-weight:700;border:1px solid transparent;cursor:default}
.btn-primary{background:var(--accent);color:#0D0C0B}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.socials{display:flex;gap:12px}
.social-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;font-weight:600;text-decoration:none}
.footer-text{margin-top:32px;text-align:center;font-size:14px;color:var(--muted)}
.footer-text a{color:var(--accent);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="left">
  <a href="#" class="left-top">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" rx="12" fill="#E07A50"/><path d="M8 20c0-6 5.6-11 12-11s12 5 12 11c0 1.5-.5 3-1 4H9c-.5-1-1-2.5-1-4z" stroke="#0D0C0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 24c2-2 5-3 8-3s6 1 8 3" stroke="#0D0C0B" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="17" r="3" fill="#0D0C0B"/></svg>
    <span>LinguaNest</span>
  </a>
  <div class="quote">"The best time to learn a language was yesterday. The <span>next best time is today.</span>"</div>
  <div class="stat"><strong>15k+</strong> lessons completed daily by learners across Uzbekistan</div>
</div>
<div class="right">
  <h1>Welcome back</h1>
  <p>Enter your details to continue your journey.</p>
  <div class="form-group"><label>Email</label><input type="email" value="nodira@example.com"></div>
  <div class="form-group"><label>Password</label><input type="password" value="••••••••"></div>
  <div class="form-options"><label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-weight:500"><input type="checkbox" checked style="accent-color:var(--accent)"> Remember me</label><a href="#">Forgot password?</a></div>
  <button class="btn btn-primary">Sign In</button>
  <div class="divider">or continue with</div>
  <div class="socials">
    <a href="#" class="social-btn">Google</a>
    <a href="#" class="social-btn">Telegram</a>
  </div>
  <div class="footer-text">Don't have an account? <a href="#">Sign up</a></div>
</div>
</body>
</html>
