<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinguaNest — Mobile Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0C0B;--surface:#151311;--text:#F3EEEA;--text-secondary:#A8A09A;--muted:#6B6560;--accent:#E07A50;--accent-bg:rgba(224,122,80,0.12);--border:rgba(243,238,234,0.08);--font-display:"Bricolage Grotesque",sans-serif;--font-body:"IBM Plex Sans",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:#181615;display:flex;justify-content:center;padding:40px 0;color:var(--text)}
.phone{width:375px;height:812px;background:var(--bg);border-radius:40px;border:8px solid #2A2826;overflow:hidden;position:relative;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 0;font-size:14px;font-weight:600;color:var(--text)}
.status-bar{height:24px}
.content{flex:1;display:flex;flex-direction:column;padding:0 28px 32px;position:relative;z-index:1}
.glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(224,122,80,0.2),transparent 70%);top:10%;left:50%;transform:translateX(-50%);z-index:0}
.logo-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.logo-wrap svg{width:80px;height:80px}
.logo-wrap h1{font-family:var(--font-display);font-size:28px;font-weight:800;text-align:center;letter-spacing:-0.02em}
.logo-wrap p{font-size:16px;color:var(--text-secondary);text-align:center;line-height:1.5;padding:0 8px}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:var(--font-display);font-weight:700;border-radius:14px;padding:16px;font-size:16px;letter-spacing:-0.01em;border:1px solid transparent}
.btn-primary{background:var(--accent);color:#0D0C0B}
.btn-ghost{color:var(--text);border-color:var(--border)}
</style>
</head>
<body>
<div class="phone">
  <div class="status status-bar"><span>9:41</span><span>•••</span></div>
  <div class="content">
    <div class="glow"></div>
    <div class="logo-wrap">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" rx="12" fill="#E07A50"/><path d="M8 20c0-6 5.6-11 12-11s12 5 12 11c0 1.5-.5 3-1 4H9c-.5-1-1-2.5-1-4z" stroke="#0D0C0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 24c2-2 5-3 8-3s6 1 8 3" stroke="#0D0C0B" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="17" r="3" fill="#0D0C0B"/></svg>
      <div>
        <h1>Your personal language nest</h1>
        <p>Learn 15+ languages from Uzbek with bite-sized lessons that fit your day.</p>
      </div>
    </div>
    <div class="actions">
      <a href="#" class="btn btn-primary">Get Started</a>
      <a href="#" class="btn btn-ghost">I already have an account</a>
    </div>
  </div>
</div>
</body>
</html>
