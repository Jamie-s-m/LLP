<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinguaNest — Mobile Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0C0B;--surface:#151311;--card:#1C1A17;--text:#F3EEEA;--text-secondary:#A8A09A;--muted:#6B6560;--accent:#E07A50;--accent-bg:rgba(224,122,80,0.12);--border:rgba(243,238,234,0.08);--font-display:"Bricolage Grotesque",sans-serif;--font-body:"IBM Plex Sans",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:#181615;display:flex;justify-content:center;padding:40px 0;color:var(--text)}
.phone{width:375px;height:812px;background:var(--bg);border-radius:40px;border:8px solid #2A2826;overflow:hidden;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px}
.header-text h1{font-family:var(--font-display);font-size:22px;font-weight:800}
.header-text p{color:var(--text-secondary);font-size:13px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#0D0C0B;display:grid;place-items:center;font-weight:700;font-family:var(--font-display);font-size:12px}
.content{flex:1;overflow:auto;padding:0 20px}
.hero-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;margin-bottom:16px}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hero-top h2{font-family:var(--font-display);font-size:16px;font-weight:700}
.streak-tag{background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px}
.course{display:flex;gap:14px;align-items:center}
.cover{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,#3A4A6B,#2A3A5B);display:grid;place-items:center;font-size:24px}
.info h3{font-size:15px;font-weight:700;margin-bottom:2px}
.info p{font-size:12px;color:var(--text-secondary);margin-bottom:8px}
.bar{height:5px;background:var(--surface);border-radius:3px;overflow:hidden;width:180px}
.bar div{height:100%;width:45%;background:var(--accent);border-radius:3px}
.section-title{font-family:var(--font-display);font-size:16px;font-weight:700;margin:20px 0 12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px;background:var(--surface);border-radius:12px;border:1px solid var(--border)}
.item-icon{width:32px;height:32px;border-radius:8px;background:var(--card);display:grid;place-items:center;font-size:14px}
.item h4{font-size:13px;font-weight:700}
.item p{font-size:11px;color:var(--muted)}
.tabs{display:flex;justify-content:space-around;padding:12px 0;border-top:1px solid var(--border);background:var(--surface)}
.tab{text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px}
.tab.active{color:var(--accent)}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="header-text">
      <h1>Hi, Nodira 👋</h1>
      <p>Ready for your daily goal?</p>
    </div>
    <div class="avatar">NK</div>
  </div>
  <div class="content">
    <div class="hero-card">
      <div class="hero-top"><h2>Continue English</h2><span class="streak-tag">🔥 12 days</span></div>
      <div class="course">
        <div class="cover">🇬🇧</div>
        <div class="info">
          <h3>Upper-Intermediate</h3>
          <p>Lesson 14 of 30</p>
          <div class="bar"><div></div></div>
        </div>
      </div>
    </div>
    <div class="section-title">Today's Quests</div>
    <div class="list">
      <div class="item"><div class="item-icon">🎯</div><div><h4>2 Lessons</h4><p>English • 20 min</p></div></div>
      <div class="item"><div class="item-icon">🎧</div><div><h4>Listening</h4><p>Korean • 15 min</p></div></div>
      <div class="item"><div class="item-icon">💬</div><div><h4>AI Chat</h4><p>Any • 10 min</p></div></div>
    </div>
    <div class="section-title">Recommended</div>
    <div class="list">
      <div class="item"><div class="item-icon" style="background:rgba(224,122,80,0.12)">🇰🇷</div><div><h4>Korean Basics</h4><p>Beginner • 4.9 ★</p></div></div>
    </div>
  </div>
  <div class="tabs">
    <a href="#" class="tab active"><span>🏠</span>Home</a>
    <a href="#" class="tab"><span>🔍</span>Explore</a>
    <a href="#" class="tab"><span>🏆</span>Awards</a>
    <a href="#" class="tab"><span>👤</span>Profile</a>
  </div>
</div>
</body>
</html>
