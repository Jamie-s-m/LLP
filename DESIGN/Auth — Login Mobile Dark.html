<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LinguaNest — Mobile Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D0C0B;--surface:#151311;--card:#1C1A17;--text:#F3EEEA;--text-secondary:#A8A09A;--muted:#6B6560;--accent:#E07A50;--accent-bg:rgba(224,122,80,0.12);--border:rgba(243,238,234,0.08);--border-strong:rgba(243,238,234,0.14);--font-display:"Bricolage Grotesque",sans-serif;--font-body:"IBM Plex Sans",sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-body);background:#181615;display:flex;justify-content:center;padding:40px 0;color:var(--text)}
.phone{width:375px;height:812px;background:var(--bg);border-radius:40px;border:8px solid #2A2826;overflow:hidden;display:flex;flex-direction:column}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
.back{width:36px;height:36px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;color:var(--text);text-decoration:none;font-size:18px}
.content{flex:1;padding:0 24px 24px;display:flex;flex-direction:column}
.content h1{font-family:var(--font-display);font-size:28px;font-weight:800;margin-bottom:8px}
.content>p{color:var(--text-secondary);font-size:15px;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em}
.form-group input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);padding:14px;border-radius:12px;font-size:15px;font-family:var(--font-body);outline:none}
.forgot{text-align:right;margin-bottom:20px}
.forgot a{color:var(--accent);text-decoration:none;font-size:13px;font-weight:600}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:16px;border-radius:14px;font-family:var(--font-display);font-size:16px;font-weight:700;border:1px solid transparent;text-decoration:none}
.btn-primary{background:var(--accent);color:#0D0C0B}
.btn-ghost{color:var(--text);border-color:var(--border);margin-top:12px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
.socials{display:flex;gap:12px}
.social-btn{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:14px;font-weight:600;text-decoration:none}
.footer-text{margin-top:auto;text-align:center;font-size:14px;color:var(--muted);padding-top:16px}
.footer-text a{color:var(--accent);text-decoration:none;font-weight:700}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <a href="#" class="back">←</a>
    <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" rx="10" fill="#E07A50"/><path d="M8 20c0-6 5.6-11 12-11s12 5 12 11c0 1.5-.5 3-1 4H9c-.5-1-1-2.5-1-4z" stroke="#0D0C0B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 24c2-2 5-3 8-3s6 1 8 3" stroke="#0D0C0B" stroke-width="2.5" stroke-linecap="round"/><circle cx="20" cy="17" r="3" fill="#0D0C0B"/></svg>
    <div style="width:36px"></div>
  </div>
  <div class="content">
    <h1>Welcome back</h1>
    <p>Sign in to continue your daily streak.</p>
    <div class="form-group"><label>Email</label><input type="email" value="nodira@example.com"></div>
    <div class="form-group"><label>Password</label><input type="password" value="••••••••"></div>
    <div class="forgot"><a href="#">Forgot password?</a></div>
    <a href="#" class="btn btn-primary">Sign In</a>
    <div class="divider">or</div>
    <div class="socials">
      <a href="#" class="social-btn">Google</a>
      <a href="#" class="social-btn">Telegram</a>
    </div>
    <div class="footer-text">New here? <a href="#">Create an account</a></div>
  </div>
</div>
</body>
</html>
